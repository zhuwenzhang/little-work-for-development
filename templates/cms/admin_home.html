{% extends "cms/admin_base.html" %}
{% block title %}管理台 - CMS{% endblock %}
{% block admin_content %}
<section class="card" style="margin-bottom:0;">
  <h1>管理概览</h1>
  <p class="muted">请在左侧选择功能模块进行管理。</p>
  <div class="stats stats-admin">
    <div class="stat-box">
      <div class="stat-num">{{ stats.category_count }}</div>
      <div>栏目</div>
    </div>
    <div class="stat-box">
      <div class="stat-num">{{ stats.item_count }}</div>
      <div>文章（已发布 {{ stats.published_count }}）</div>
    </div>
    <div class="stat-box">
      <div class="stat-num">{{ stats.user_count }}</div>
      <div>用户</div>
    </div>
  </div>
</section>
{% endblock %}
