{% extends "base.html" %}
{% block title %}{{ item.title }} - CMS{% endblock %}
{% block content %}
<article class="card">
  <p><a href="{% url 'cms:home' %}">← 返回列表</a></p>
  <h1>{{ item.title }}</h1>
  <p class="meta">栏目：{{ item.category.name }} · 作者：{{ item.author|default:"-" }} · 发表：{{ item.published_at|date:"Y-m-d H:i" }}</p>
  <div class="content">{{ item.content|linebreaks }}</div>
</article>
{% endblock %}
