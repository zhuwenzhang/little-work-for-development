{% extends "cms/admin_base.html" %}
{% block title %}新增用户 - CMS{% endblock %}
{% block admin_content %}
<section class="card" style="margin-bottom:0;max-width:520px;">
  <h1>新增用户</h1>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>用户ID
      <input name="user_id" maxlength="15" value="{{ form.user_id }}" required>
    </label>
    <label>密码
      <input type="text" name="password" maxlength="30" value="{{ form.password }}" required>
    </label>
    <label>姓名
      <input name="name" maxlength="30" value="{{ form.name }}" required>
    </label>
    <label>用户类型
      <select name="user_type">
        {% for value, label in type_choices %}
          <option value="{{ value }}" {% if form.user_type == value|stringformat:"s" %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit">创建</button>
  </form>
  <p><a href="{% url 'cms:user_list' %}">← 返回用户列表</a></p>
</section>
{% endblock %}
