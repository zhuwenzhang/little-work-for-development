{% extends "base.html" %}
{% block title %}登录 - CMS{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>用户登录</h1>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>用户ID
      <input name="user_id" maxlength="15" value="{{ form.user_id }}" required>
    </label>
    <label>密码
      <input type="text" name="password" maxlength="30" value="{{ form.password }}" required>
    </label>
    <button type="submit">登录</button>
  </form>
  <p class="muted">还没有账号？<a href="{% url 'accounts:register' %}">去注册</a></p>
</section>
{% if error %}
<script>alert("{{ error|escapejs }}");</script>
{% endif %}
{% endblock %}
